# Pull request validation: checks the framework and every project without calling any API.
# Azure Repos: add this pipeline as a Build Validation policy on the main branch
# (Project settings > Repositories > Policies > main > Build Validation).
# Also add "Automatically included reviewers" for the path /src/* so framework changes need owner approval.

trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: Use Node 20

  - script: npm ci
    displayName: Install dependencies

  - script: npm run typecheck
    displayName: Typecheck

  - script: npm run lint
    displayName: Lint

  - script: npx playwright test --project=selfcheck
    displayName: Framework selfcheck

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: reports/selfcheck/junit/results.xml
      testRunTitle: Framework selfcheck
    displayName: Publish selfcheck results
